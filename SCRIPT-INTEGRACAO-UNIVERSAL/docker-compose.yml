version: "3.8"

services:
  app:
    build: .
    container_name: integracao-universal
    restart: unless-stopped
    ports:
      - "${PORT:-3100}:3100"
    env_file:
      - src/.env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: integracao-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: integracao-universal
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # Descomente se precisar de Redis para filas/cache
  # redis:
  #   image: redis:7-alpine
  #   container_name: integracao-redis
  #   restart: unless-stopped
  #   ports:
  #     - "6379:6379"
  #   networks:
  #     - app-network

volumes:
  mongo-data:

networks:
  app-network:
    driver: bridge
