<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pesquisa de Satisfação — Axion Tecnologia</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', Arial, sans-serif; background: #f5f5f5; width: 480px; padding: 0; }
.card {
  background: #ffffff;
  padding: 36px 32px 28px;
  position: relative;
}
.logo {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 28px;
}
.logo-icon {
  width: 36px; height: 36px;
  background: #5c2751;
  border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 900; color: white;
}
.logo-text {
  font-size: 22px; font-weight: 800; color: #1e2d4a;
  letter-spacing: 2px;
}
.logo-sub { font-size: 9px; color: #5c6b7a; letter-spacing: 3px; display: block; margin-top: -2px; }
.bubble {
  background: #1e2d4a;
  display: inline-block;
  padding: 16px 24px;
  border-radius: 12px;
  border-bottom-left-radius: 4px;
  margin-bottom: 22px;
  position: relative;
}
.bubble h1 {
  font-size: 26px;
  font-weight: 800;
  color: #ffffff;
  line-height: 1.25;
}
.bubble h1 span { color: #ffffff; font-weight: 900; }
.subtitle {
  font-size: 16px;
  color: #3a3a3a;
  line-height: 1.6;
  margin-bottom: 24px;
  font-style: italic;
}
.subtitle strong { font-style: italic; font-weight: 700; color: #1e2d4a; }
.cta {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: #1e2d4a;
  color: white;
  padding: 12px 28px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.5px;
}
.footer-bar {
  background: #1e2d4a;
  padding: 12px 32px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11px;
  color: rgba(255,255,255,0.85);
}
</style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-icon">A</div>
    <div>
      <span class="logo-text">AXION</span>
      <span class="logo-sub">TECNOLOGIA</span>
    </div>
  </div>
  <div class="bubble">
    <h1>A SUA <span>OPINIÃO</span><br>É FUNDAMENTAL</h1>
  </div>
  <div class="subtitle">Para melhorar nosso Atendimento, por favor,<br>responda nossa <strong>Pesquisa</strong><br>clicando abaixo.</div>
  <div class="cta">⭐ Avalie nosso atendimento</div>
</div>
<div class="footer-bar">
  <span>🌐 www.axiontecnologia.com.br</span>
  <span>📷 @axiontecnologia</span>
</div>
</body>
</html>
